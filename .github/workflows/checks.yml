# Static checks and the tests that need neither VALDO (not redistributable) nor a GPU: synthetic phantoms, privacy,
# command line, run-stopping checks, property tests. The VALDO tests (marker "valdo") run locally only.
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONNOUSERSITE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            env/requirements.txt
            pyproject.toml
      - name: Install (CPU PyTorch, the pinned runtime, test and check tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r env/requirements.txt
          python -m pip install -e ".[test,dev]"
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format)
        run: ruff format --check .
      - name: pyright
        run: pyright
      - name: import contracts
        run: lint-imports
      - name: selftest
        run: python -m cmb selftest
      - name: tests (no VALDO, CPU)
        run: python -m pytest -q tests -m "not valdo"
